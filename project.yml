name: Basil
options:
  bundleIdPrefix: com.flameborn
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  BasilCore: { path: Packages/BasilCore }
  BasilVFS: { path: Packages/BasilVFS }
  BasilOperations: { path: Packages/BasilOperations }
  BasilArchives: { path: Packages/BasilArchives }
  BasilRemote: { path: Packages/BasilRemote }
  BasilGit: { path: Packages/BasilGit }
  BasilSearch: { path: Packages/BasilSearch }
  BasilSync: { path: Packages/BasilSync }
  BasilPlugins: { path: Packages/BasilPlugins }
  BasilIntegrations: { path: Packages/BasilIntegrations }
  BasilUI: { path: Packages/BasilUI }

targets:
  Basil:
    type: application
    platform: macOS
    sources:
      - App/Sources
      # Icon Composer document (layers in Assets/); Xcode compiles it into the app icon.
      - path: App/Resources/AppIcon.icon
        buildPhase: resources
      # Shown by About Basil > License.
      - path: LICENSE
        buildPhase: resources
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleName: Basil
        CFBundleDisplayName: Basil
        CFBundleShortVersionString: "0.2.0"
        CFBundleVersion: "2"
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "Copyright 2026 Flameborn. MIT License."
        NSPrincipalClass: NSApplication
        # Dropbox: the app key (Config/Dropbox.local.xcconfig). The sign-in returns to
        # http://localhost:21745/dropbox, served by Basil while it waits (SignInReturnServer).
        BasilDropboxAppKey: $(BASIL_DROPBOX_APP_KEY)
        # Google Drive: the OAuth client (Config/GoogleDrive.local.xcconfig). The sign-in returns
        # to http://127.0.0.1:<free port>/google, served by Basil while it waits.
        BasilGoogleClientID: $(BASIL_GOOGLE_CLIENT_ID)
        BasilGoogleClientSecret: $(BASIL_GOOGLE_CLIENT_SECRET)
        # OneDrive: the Microsoft Entra client ID (Config/OneDrive.local.xcconfig). The sign-in
        # returns to http://localhost:<free port>/onedrive (Microsoft ignores the port).
        BasilOneDriveClientID: $(BASIL_ONEDRIVE_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flameborn.basil
        PRODUCT_NAME: Basil
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The 7zz phase builds into Vendor/build, outside what a sandboxed script may write.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build 7zz
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/Vendor/7zip/build.sh"
    postCompileScripts:
      - name: Copy and sign 7zz
        inputFiles:
          - $(SRCROOT)/Vendor/build/7zip/7zz
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_FOLDER_PATH)/7zz
        script: |
          set -e
          dest="$TARGET_BUILD_DIR/$EXECUTABLE_FOLDER_PATH/7zz"
          cp -f "$SRCROOT/Vendor/build/7zip/7zz" "$dest"
          codesign --force --sign "$EXPANDED_CODE_SIGN_IDENTITY" --timestamp=none "$dest"
    dependencies:
      - package: BasilCore
      - package: BasilVFS
      - package: BasilOperations
      - package: BasilArchives
      - package: BasilRemote
      - package: BasilGit
      - package: BasilSearch
      - package: BasilSync
      - package: BasilPlugins
      - package: BasilIntegrations
      - package: BasilUI

  BasilUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [Tests/BasilUITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flameborn.basil.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Basil
    dependencies:
      - target: Basil

schemes:
  Basil:
    build:
      targets:
        Basil: all
    test:
      targets: [BasilUITests]
